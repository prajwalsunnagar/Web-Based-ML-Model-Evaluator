name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Lint, Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Code style and lint check (flake8)
        run: flake8 app.py evaluator/ tests/ --max-line-length=120 --exclude=.venv

      - name: Production / build compilation check
        run: python -m py_compile app.py evaluator/*.py tests/*.py

      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short --cov=evaluator --cov=. --cov-report=term-missing

      - name: Confirm workflow completed
        run: echo "All linting, build, and test checks passed on Python ${{ matrix.python-version }}!"
